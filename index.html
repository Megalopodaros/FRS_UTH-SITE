<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FRS UTH — Φοιτητικός Ραδιοφωνικός Σταθμός Πανεπιστημίου Θεσσαλίας. Ζωντανή μετάδοση, εβδομαδιαίο πρόγραμμα, live chat και αρχείο εκπομπών." />
    <meta name="theme-color" content="#0a0e15" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/radio-logo.png" />
    <link rel="apple-touch-icon" href="/radio-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>FRS UTH — Φοιτητικό Ραδιόφωνο</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes
      // the wrong background on load.
      try {
        if (localStorage.getItem("frs_theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
